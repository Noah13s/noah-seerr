name: Noah Seerr bridge
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  bridge-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - run: node --experimental-transform-types --test scripts/test-player-bridge.cjs
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: pnpm typecheck:client
      - run: pnpm typecheck:server
      - run: node --test scripts/test-runner.test.cjs scripts/test-coverage-report.cjs
      - run: node --test scripts/native-playback-session.test.cjs
      - run: mkdir -p coverage
      # Native node:test LCOV uses transpiled locations under ts-node. c8 remaps
      # V8 ranges through inline source maps before Sonar reads TypeScript lines.
      - run: pnpm test:coverage
        env:
          CI: true
      - run: pnpm build:server
      - run: node -e "require('./dist/lib/native-playback-session.cjs')"
      - run: pnpm build:next
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seerr-test-results-${{ github.sha }}
          path: |
            report.xml
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14
  sonar:
    if: vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: bridge-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: seerr-test-results-${{ github.sha }}
      - name: Require coverage and a configured analysis token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          test -s coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the production allowlist image
        run: docker build --progress=plain --tag noah-seerr:ci .
      - name: Start with isolated disposable configuration and verify runtime
        run: |
          docker run --detach --name seerr-container-ci --network none noah-seerr:ci
          trap 'docker logs seerr-container-ci; docker rm --force seerr-container-ci' EXIT
          docker cp scripts/check-runtime-image.mjs seerr-container-ci:/tmp/check-runtime-image.mjs
          docker exec seerr-container-ci node /tmp/check-runtime-image.mjs
  browser-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:next
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Start isolated SSR/API fixture and run browser journeys
        run: |
          node scripts/browser-fixture.cjs > browser-fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --max-time 5 -fsS http://127.0.0.1:5055/login > /dev/null; then break; fi
            sleep 1
          done
          curl --max-time 5 -fsS http://127.0.0.1:5055/login > /dev/null
          pnpm exec cypress run --config-file cypress.fixture.config.ts --browser electron
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seerr-browser-${{ github.sha }}
          path: |
            cypress/screenshots/
            cypress/videos/
            browser-fixture.log
          if-no-files-found: ignore
          retention-days: 14
